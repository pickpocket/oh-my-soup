[package]
name = "oms-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Content-blind WebSocket relay for encrypted OMS collaboration sessions"
repository = "https://github.com/pickpocket/oh-my-soup"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
parking_lot = "0.12.5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tungstenite = { version = "0.29", default-features = false }

[dev-dependencies]
serde_json = "1"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
